# Pinned so running this from db/ keeps the same project (and therefore the
# same named volume) as when the file lived at the repo root.
name: udyam-sathi

services:
  db:
    image: postgres:16-alpine
    container_name: udyam-sathi-db
    environment:
      POSTGRES_USER: udyam_sathi
      POSTGRES_PASSWORD: udyam_sathi
      POSTGRES_DB: udyam_sathi
    ports:
      # 5433 on the host: a local Postgres may already own 5432, and this
      # container must never shadow it
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U udyam_sathi -d udyam_sathi']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:

