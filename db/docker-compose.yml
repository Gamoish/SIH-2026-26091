# Pinned so running this from db/ keeps the same project (and therefore the
# same named volume) as when the file lived at the repo root.
name: disha

services:
  db:
    image: postgres:16-alpine
    container_name: disha-db
    environment:
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: disha
      POSTGRES_DB: disha
    ports:
      # 5433 on the host: a local Postgres may already own 5432, and this
      # container must never shadow it
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U disha -d disha']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
