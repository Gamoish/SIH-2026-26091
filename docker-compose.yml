# The whole user portal in one command:
#
#   docker compose up --build
#
#   frontend  http://localhost:3000
#   api       http://localhost:4000
#   postgres  localhost:5433
#
# This is an ADDITIONAL way to run the project, not a replacement. The
# per-package workflow (`pnpm db:up`, `pnpm api:dev`, `pnpm dev`) is untouched
# and still the faster loop for day-to-day work - see RUNNING.md.
#
# `include` pulls in db/docker-compose.yml rather than redefining Postgres
# here. That file is pinned to `name: udyam-sathi` so its named volume survives, and
# `pnpm db:up` targets it by path; duplicating the service would give the two
# entry points two different volumes and quietly split the database in half.
name: udyam-sathi

include:
  - db/docker-compose.yml

services:
  # One-shot. Runs to completion, then the API starts. Deliberately a separate
  # service rather than a step in the API's entrypoint: it fails loudly and on
  # its own, and `service_completed_successfully` gives exact ordering instead
  # of a sleep or a retry loop in application code.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['pnpm', 'migrate']
    environment:
      # In-network address: service name `db`, container port 5432. The host
      # publishes 5433 to dodge a local Postgres, but that mapping does not
      # apply between containers.
      DATABASE_URL: postgresql://udyam_sathi:udyam_sathi@db:5432/udyam_sathi
      JWT_SECRET: ${JWT_SECRET:-compose-local-dev-secret-not-for-production-0123456789}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Values in `environment` override anything in env_file, so a developer's
    # .env.local supplies the optional extras (Bhashini keys, OTP provider)
    # while the container-specific wiring below always wins.
    env_file:
      - path: backend/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql://udyam_sathi:udyam_sathi@db:5432/udyam_sathi
      API_PORT: '4000'
      # Where the BROWSER loads the frontend from, which is what the CORS
      # check compares against - not the compose service name.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-compose-local-dev-secret-not-for-production-0123456789}
      # This stack is for local demo and onboarding. NODE_ENV is left at its
      # default on purpose: setting it to production makes env.ts (correctly)
      # demand a real 32-char secret and an SMS provider key, and there is no
      # SMS provider here. Prints the OTP to `docker compose logs api`.
      OTP_DEV_MODE: 'true'
      OTP_DEV_FIXED_CODE: ${OTP_DEV_FIXED_CODE:-1234}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The same /health route the Playwright config waits on.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # BUILD-time, not runtime: Next inlines NEXT_PUBLIC_* into the client
        # bundle. localhost:4000 is correct because this fetch runs in the
        # user's browser, which cannot resolve the `api` service name.
        # Changing it requires a rebuild, not a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        # The villages table is empty until an LGD/Census export is imported,
        # so a cold `docker compose up` offers the labelled demo fixtures and
        # the flow is walkable end to end. Turn this off once you have imported
        # real data.
        NEXT_PUBLIC_DEMO_VILLAGES: ${NEXT_PUBLIC_DEMO_VILLAGES:-true}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

