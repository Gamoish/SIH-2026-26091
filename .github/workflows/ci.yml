name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Auth is real and server-side, so the suite needs the API and a database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: udyam_sathi
          POSTGRES_PASSWORD: udyam_sathi
          POSTGRES_DB: udyam_sathi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U udyam_sathi -d udyam_sathi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://udyam_sathi:udyam_sathi@localhost:5433/udyam_sathi
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @udyam-sathi/frontend exec playwright install --with-deps chromium
      - name: Apply migrations
        run: pnpm api:migrate
        env:
          DATABASE_URL: postgresql://udyam_sathi:udyam_sathi@localhost:5433/udyam_sathi
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      - run: pnpm e2e
        env:
          CI: true
          DATABASE_URL: postgresql://udyam_sathi:udyam_sathi@localhost:5433/udyam_sathi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
